[project]
name = "birdeye-smart-cvd"
version = "0.1.0"
description = "Free-tier Birdeye Solana Smart-Money Proxy + 15m CVD signal scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "python-telegram-bot>=22.8",
    "telegramify-markdown>=1.2.0",
    # Offline v0-transaction signing for simulate-only Jupiter checks
    # (quote -> assemble with throwaway taker -> sign -> simulateTransaction,
    # never broadcast). No solana-py needed; solders covers keypair + tx.
    "solders>=0.23",
    "base58>=2.1",
]

[project.scripts]
birdeye-scanner = "birdeye_smart_cvd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
