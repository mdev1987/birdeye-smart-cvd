[project]
name = "birdeye-smart-cvd"
version = "0.1.0"
description = "Free-tier Birdeye Solana smart-money proxy + 15m CVD signal scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
birdeye-scanner = "birdeye_smart_cvd.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
